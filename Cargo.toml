[workspace]
resolver = "2"
members = ["crates/core", "src-tauri"]

# Optimise dependencies even in debug builds (`cargo run`). Without this, hashing and
# unzipping run 10-50x slower than in a release build.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.mcmap-core]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 4
