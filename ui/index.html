<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minecraft Daily Maps</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>Minecraft Daily Maps</h1>
  <div class="top-actions">
    <button id="btn-viewer" class="primary">Open map viewer</button>
    <button id="btn-folder">Open data folder</button>
    <button id="btn-settings">Settings</button>
  </div>
</header>

<main class="layout">
  <section class="col">
    <div id="dropzone" class="drop">
      <div class="drop-title">Drop a world zip here</div>
      <div class="muted">or put it in the <code>inbox/</code> folder</div>
      <button id="btn-browse">Choose zip&hellip;</button>
    </div>
    <div id="pending"></div>

    <div class="card">
      <div class="card-head">
        <h2>Queue</h2>
        <button id="btn-clear" class="ghost">Clear finished</button>
      </div>
      <div id="queue" class="stack"></div>
    </div>
  </section>

  <section class="col">
    <div class="card">
      <div class="card-head">
        <h2>Snapshots</h2>
        <span id="snap-count" class="muted"></span>
      </div>
      <div id="snapshots"></div>
    </div>
  </section>
</main>

<div id="toasts"></div>

<!-- First launch -->
<dialog id="dlg-first">
  <form method="dialog" id="form-first">
    <h2>Choose a data folder</h2>
    <p class="muted">Zips, tiles and the HTML viewers are stored here, one folder per day. Pick a folder with plenty of free space.</p>
    <div class="row">
      <input id="first-path" type="text" spellcheck="false">
      <button type="button" id="first-browse">Browse&hellip;</button>
    </div>
    <div class="actions"><button type="submit" class="primary">Use this folder</button></div>
  </form>
</dialog>

<!-- Settings -->
<dialog id="dlg-settings">
  <form method="dialog" id="form-settings">
    <h2>Settings</h2>
    <label class="field">
      <span>uNmINeD CLI (<span id="set-platform"></span>)</span>
      <div class="row">
        <input id="set-unmined" type="text" spellcheck="false" placeholder="Path to unmined-cli">
        <button type="button" id="set-browse">Browse&hellip;</button>
      </div>
    </label>
    <div class="field">
      <span>Default dimensions</span>
      <div id="set-dims" class="checks"></div>
    </div>
    <label class="field">
      <span>Extra zoom levels (<code>--zoomin</code>, each level is 4&times; more tiles)</span>
      <input id="set-zoom" type="number" min="0" max="4" step="1">
    </label>
    <label class="check"><input id="set-keep" type="checkbox"> Keep the extracted world after rendering</label>
    <label class="check"><input id="set-link" type="checkbox"> Hard-link unchanged tiles instead of copying (same volume only)</label>
    <label class="check"><input id="set-auto" type="checkbox"> Import zips from <code>inbox/</code> automatically</label>
    <label class="field">
      <span>Extra uNmINeD arguments</span>
      <input id="set-extra" type="text" spellcheck="false" placeholder="e.g. --shadows=true">
    </label>
    <div class="field">
      <span>Data folder</span>
      <div class="row"><code id="set-datadir" class="grow"></code><button type="button" id="set-change-dir">Change&hellip;</button></div>
    </div>
    <div class="actions">
      <button type="button" id="set-rebuild" class="ghost">Rebuild HTML</button>
      <span class="grow"></span>
      <button type="button" id="set-cancel">Cancel</button>
      <button type="submit" class="primary">Save</button>
    </div>
  </form>
</dialog>

<!-- Re-render -->
<dialog id="dlg-rerender">
  <form method="dialog" id="form-rerender">
    <h2>Re-render snapshot</h2>
    <p id="rr-title" class="muted"></p>
    <div id="rr-dims" class="checks"></div>
    <div class="actions">
      <button type="button" id="rr-cancel">Cancel</button>
      <button type="submit" class="primary">Re-render</button>
    </div>
  </form>
</dialog>

<!-- Confirm -->
<dialog id="dlg-confirm">
  <form method="dialog">
    <p id="confirm-text"></p>
    <div class="actions">
      <button type="button" id="confirm-no">Cancel</button>
      <button type="button" id="confirm-yes" class="danger">Delete</button>
    </div>
  </form>
</dialog>

<script src="main.js"></script>
</body>
</html>
